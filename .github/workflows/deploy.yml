name: Build and Deploy (FTP)

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Vite app
        run: npm run build

      - name: Deploy via FTP
        uses: milanmk/actions-file-deployer@master
        with:
          remote-protocol: ftp
          remote-host: 'bennadda-dreamcar.com'
          remote-port: 21
          remote-user: 'YOUR_FTP_USERNAME'
          remote-password: ${{ secrets.SFTP_PASSWORD }}
          local-path: './dist'
          remote-path: '/'
          sync: full