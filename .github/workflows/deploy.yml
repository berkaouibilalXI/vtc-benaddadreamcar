name: Node & Vite App CI/CD Pipeline (SFTP)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Project Dependencies
      run: npm install

    - name: Build Vite Frontend Assets
      run: npm run build

    - name: Synchronize Files via SFTP
      uses: pressdown/sftp-upload-action@v2
      with:
        host: ${{ secrets.SFTP_HOST }}
        username: 'gmzrkfea'
        password: ${{ secrets.SFTP_PASSWORD }}
        port: 22
        local_path: './'
        remote_path: '/home/gmzrkfea/repositories/vtc-benaddadreamcar'