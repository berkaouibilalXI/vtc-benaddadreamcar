name: Build and Deploy (FTP)

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04 # pins the OS, so the Ubuntu 26 migration won't affect you
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Vite app
        run: npm run build

      - name: Show build output
        run: ls -la dist

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy via FTP
        env:
          FTP_USER: 'deployment@benadda-dreamcar.com'
          FTP_PASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" 54.36.246.134 -p 21 <<'EOF'
          set cmd:fail-exit yes
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          set net:max-retries 2
          set net:timeout 20
          mirror --reverse --verbose --parallel=3 dist/ /
          echo "---- Remote listing ----"
          cls -l
          bye
          EOF