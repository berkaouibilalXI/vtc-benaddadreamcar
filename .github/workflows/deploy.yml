name: Build and Deploy (SFTP)

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy via SFTP
        uses: milanmk/actions-file-deployer@<PINNED_SHA_OR_TAG>
        with:
          remote-protocol: sftp
          remote-host: 'bennadda-dreamcar.com'
          remote-port: 22
          remote-user: 'gmzrkfea'
          remote-password: ${{ secrets.SFTP_PASSWORD }}
          local-path: './dist'
          remote-path: '/home/gmzrkfea/public_html/vtc-oran'
          sync: delta