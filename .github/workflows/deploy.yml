name: Node & Vite App CI/CD Pipeline (SFTP)

on:
  push:
    branches:
      - main # Change this to 'master' if your default branch uses that name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Project Dependencies
      run: npm install

    - name: Build Vite Frontend Assets
      run: npm run build

    - name: Synchronize Files via SFTP
      uses: nwtgck/actions-sftp-deploy@v1.2.2
      with:
        username: 'gmzrkfea'                    # Your cPanel account username
        host: '://bennadda-dreamcar.com'     # Your domain
        password: ${{ secrets.SFTP_PASSWORD }}  # Your cPanel account password
        port: 22                                 # Secure SFTP port
        local_path: './'                         # Upload everything from the runner environment
        remote_path: '/home/gmzrkfea/repositories/vtc-benaddadreamcar' # App root path
