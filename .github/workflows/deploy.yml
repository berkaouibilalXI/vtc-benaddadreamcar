name: Node & Vite App CI/CD Pipeline (SFTP)

on:
  push:
    branches:
      - main # Change this to 'master' if your default branch uses that name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Project Dependencies
      run: npm install

    - name: Build Vite Frontend Assets
      run: npm run build

    - name: Synchronize Files via SFTP
      uses: milanmk/actions-file-deployer@master
      with:
        remote-protocol: sftp                   # Forces secure SFTP file delivery
        remote-host: '://bennadda-dreamcar.com' # Your cPanel host destination domain
        remote-port: 22                         # Standard secure SSH port
        remote-user: 'gmzrkfea'                 # Your verified cPanel username
        remote-password: ${{ secrets.SFTP_PASSWORD }} # Your cPanel account password
        remote-path: '/home/gmzrkfea/repositories/vtc-benaddadreamcar' # Document root folder path
        sync: delta                             # Syncs only modified files to optimize upload speed
