name: Build and Deploy (SFTP)

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Vite app
        run: npm run build

      - name: Deploy via SFTP
        uses: milanmk/actions-file-deployer@master
        with:
          remote-protocol: sftp
          remote-host: 'bennadda-dreamcar.com'
          remote-port: 22
          remote-user: 'gmzrkfea'
          remote-password: ${{ secrets.SFTP_PASSWORD }}
          local-path: './dist'
          remote-path: '/home/gmzrkfea/public_html/vtc-oran'
          sync: delta